# Builds the Android version of the emulator from this branch (with the
# TinkerBox HD fixes), named "TinkerBox HD", and publishes the unsigned-for-you
# APK plus the tools needed to finish it:
#   * as an artifact you can download from the Actions tab, and
#   * on the `android-apk-output` branch, replacing what was there.
#
# Contains no game files. The game is added to the APK afterwards, outside of
# GitHub (see BUNDLED_APP_FILE in src/paths.rs), then the APK is signed.

name: Build TinkerBox APK

on:
  workflow_dispatch:
  push:
    branches:
      - tinkerbox-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Download the emulator code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: vendor/boost
          key: boost_1_81_0_linux

      - name: Download Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          curl -fL -o boost.tar.gz "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"
          tar xzf boost.tar.gz -C vendor
          mv vendor/boost_1_81_0 vendor/boost

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"

      - name: Install Rust for Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk@3.5.4

      - name: Cache Gradle
        id: cache-gradle
        uses: actions/cache@v4
        with:
          path: gradle
          key: gradle-8.11.1

      - name: Download Gradle
        if: steps.cache-gradle.outputs.cache-hit != 'true'
        run: |
          curl -fL -o gradle.zip "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
          7z -ogradle x gradle.zip

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk
          key: android-ndk-r25c

      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          curl -fL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip"
          7z -oandroid-ndk -snld x ndk.zip

      - name: Set up Android NDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/ndk"
          ln -sfn "$PWD/android-ndk/android-ndk-r25c" "$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build the APK (the long step)
        run: |
          cd android
          ../gradle/gradle-8.11.1/bin/gradle assembleRelease \
            -PtouchHLEAppName="TinkerBox HD" \
            -PtouchHLEAppId=com.neimoru.tinkerbox
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Collect the APK and signing tools
        run: |
          mkdir -p out/lib64
          cp android/app/build/outputs/apk/release/app-release.apk out/TinkerBox-emulator-only.apk
          BT="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          echo "Using build tools from $BT"
          cp "$BT/zipalign" out/
          cp "$BT/lib/apksigner.jar" out/
          cp "$BT"/lib64/libc++.so* out/lib64/ 2>/dev/null || true
          ls -la out out/lib64

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: TinkerBox-APK-emulator-only
          path: out/
          if-no-files-found: error

      - name: Publish to the android-apk-output branch
        run: |
          cd out
          git init -q -b android-apk-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "APK built from ${GITHUB_SHA} (no game files)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" android-apk-output
