      - name: Show Xcode version
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Install Rust for iOS
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: vendor/boost
          key: boost_1_81_0_macos

      - name: Download Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          curl -fL -o boost.tar.gz "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"
          mkdir -p vendor
          tar xzf boost.tar.gz -C vendor
          mv vendor/boost_1_81_0 vendor/boost

      - name: Build SDL (must come first)
        run: sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Build the app (the long step)
        run: sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Package the .ipa
        run: |
          sh platform/ios/scripts/package-ipa.sh
          ls -la dist

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Applesauce-TinkerBox-IPA
          path: dist/Applesauce-iOS-unsigned.ipa
          if-no-files-found: error
