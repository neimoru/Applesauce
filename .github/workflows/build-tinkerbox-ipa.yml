# Builds Applesauce (a 64-bit iOS app that runs old 32-bit iPhone/iPad games)
# with the TinkerBox HD fixes applied, and publishes an unsigned .ipa you can
# sideload. Runs entirely on GitHub's cloud Macs; no Mac of your own needed.
#
# It starts automatically when this file is added, and can be re-run any time
# from the Actions tab ("Run workflow").
#
# Contains no game files. You add your own TinkerBox copy on the phone.

name: Build TinkerBox IPA

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-tinkerbox-ipa.yml

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Download the emulator code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply the TinkerBox fixes
        run: |
          python3 - <<'PY'
          import base64, os
          open("tinkerbox.patch", "wb").write(base64.b64decode(os.environ["PATCH_B64"]))
          PY
          git apply tinkerbox.patch
          git --no-pager diff --stat
