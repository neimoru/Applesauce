# Builds Applesauce (a 64-bit iOS app that runs old 32-bit iPhone/iPad games)
# from this branch, which carries the TinkerBox HD fixes, and publishes an
# unsigned .ipa you can sideload. Runs entirely on GitHub's cloud Macs; no Mac of your own needed.
#
# It runs on every push to the tinkerbox-build branch, and can be re-run any
# time from the Actions tab.
#
# Contains no game files. You add your own TinkerBox copy on the phone.

name: Build TinkerBox IPA

on:
  workflow_dispatch:
  push:
    branches:
      - tinkerbox-build

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Download the emulator code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Install Rust for iOS
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: vendor/boost
          key: boost_1_81_0_macos

      - name: Download Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          curl -fL -o boost.tar.gz "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"
          mkdir -p vendor
          tar xzf boost.tar.gz -C vendor
          mv vendor/boost_1_81_0 vendor/boost

      - name: Build SDL (must come first)
        run: sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Build the app (the long step)
        run: sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Package the .ipa
        run: |
          sh platform/ios/scripts/package-ipa.sh
          ls -la dist

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Applesauce-TinkerBox-IPA
          path: dist/Applesauce-iOS-unsigned.ipa
          if-no-files-found: error
